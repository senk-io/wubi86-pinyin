name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，如 v0.5.0（在当前提交上创建这个标签）"
        required: true

permissions:
  contents: write

jobs:
  packages:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install packages
        # 两个安装包：wubi86-pinyin.zip（SENK五笔混拼输入法86版）和 pinyin.zip（SENK拼音输入法）。
        # 内容都是这个版本的源码，只是根目录的 VARIANT 不同，安装脚本据此决定装哪个方案。
        run: |
          mkdir -p dist
          for variant in wubi86-pinyin pinyin; do
            stage=$(mktemp -d)
            git archive --format=tar --prefix="$variant/" HEAD | tar -x -C "$stage"
            echo "$variant" > "$stage/$variant/VARIANT"
            (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/dist/$variant.zip" "$variant")
          done
          cd dist && sha256sum *.zip > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --generate-notes
