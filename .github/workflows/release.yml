name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  wubi86d:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
      - name: Build
        working-directory: helper
        run: |
          mkdir -p ../dist
          GOOS=darwin GOARCH=arm64 go build -trimpath -o ../dist/wubi86d-darwin-arm64 .
          GOOS=darwin GOARCH=amd64 go build -trimpath -o ../dist/wubi86d-darwin-amd64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -o ../dist/wubi86d-windows-amd64.exe .
          cd ../dist && sha256sum wubi86d-* > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --generate-notes
