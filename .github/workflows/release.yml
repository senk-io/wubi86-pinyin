name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      version:
        description: "版本号，如 v0.5.0（在当前提交上创建这个标签）"
        required: true

permissions:
  contents: write

jobs:
  wubi86d:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: helper/go.mod
      - name: Build
        working-directory: helper
        run: |
          mkdir -p ../dist
          GOOS=darwin GOARCH=arm64 go build -trimpath -o ../dist/wubi86d-darwin-arm64 .
          GOOS=darwin GOARCH=amd64 go build -trimpath -o ../dist/wubi86d-darwin-amd64 .
          GOOS=windows GOARCH=amd64 go build -trimpath -o ../dist/wubi86d-windows-amd64.exe .
      - name: Install packages
        # 两个安装包：wubi86-pinyin.zip（五笔86·拼音混输）和 pinyin.zip（纯拼音）。
        # 内容都是这个版本的源码，只是根目录的 VARIANT 不同，安装脚本据此决定装哪个方案。
        run: |
          for variant in wubi86-pinyin pinyin; do
            stage=$(mktemp -d)
            git archive --format=tar --prefix="$variant/" HEAD | tar -x -C "$stage"
            echo "$variant" > "$stage/$variant/VARIANT"
            (cd "$stage" && zip -qr "$GITHUB_WORKSPACE/dist/$variant.zip" "$variant")
          done
          cd dist && sha256sum wubi86d-* *.zip > SHA256SUMS
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ inputs.version || github.ref_name }}
        run: gh release create "$VERSION" dist/* --target "$GITHUB_SHA" --generate-notes
