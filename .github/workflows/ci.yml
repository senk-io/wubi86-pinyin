name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install librime
        run: |
          sudo apt-get update
          sudo apt-get install -y librime-dev librime-bin librime-data librime-plugin-lua
      - name: Run schema tests
        run: tests/run.sh
