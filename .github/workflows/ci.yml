name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  schema:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install librime
        run: |
          sudo apt-get update
          sudo apt-get install -y librime-dev librime-bin librime-data librime-plugin-lua
      - name: Run schema tests
        run: tests/run.sh

  pinyin-bench:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install librime
        run: |
          sudo apt-get update
          sudo apt-get install -y librime-dev librime-bin librime-data librime-plugin-lua librime-plugin-octagram
      - name: Download grammar (same pinned version as scripts/install-grammar-macos.sh)
        run: |
          commit=$(sed -n 's/^commit="\(.*\)"$/\1/p' scripts/install-grammar-macos.sh)
          sha=$(sed -n 's/^sha256="\(.*\)"$/\1/p' scripts/install-grammar-macos.sh)
          curl -fsSL -o "$RUNNER_TEMP/zh-hans-t-essay-bgw.gram" \
            "https://raw.githubusercontent.com/lotem/rime-octagram-data/$commit/zh-hans-t-essay-bgw.gram"
          echo "$sha  $RUNNER_TEMP/zh-hans-t-essay-bgw.gram" | sha256sum -c -
      - name: Without grammar
        run: |
          tests/bench.sh "" 29
          tests/bench.sh "" 29 pinyin
      - name: With grammar
        run: |
          tests/bench.sh "$RUNNER_TEMP/zh-hans-t-essay-bgw.gram" 34
          tests/bench.sh "$RUNNER_TEMP/zh-hans-t-essay-bgw.gram" 34 pinyin


  scripts-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: sh -n (all scripts)
        run: for f in scripts/*.sh tests/*.sh; do sh -n "$f" || exit 1; done
      - name: shellcheck
        run: shellcheck scripts/install-macos.sh scripts/uninstall-macos.sh scripts/install-grammar-macos.sh scripts/assemble.sh
      - name: 脚本和说明里只有 SENK，没有上游前端的名字
        run: |
          if grep -n -i -e squirrel -e 鼠须管 -e 鼠鬚管 scripts/*.sh scripts/*.js README.md; then exit 1; fi

  install-macos-preview:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Input source query reads the system's real state
        run: |
          q() { osascript -l JavaScript scripts/input-source-state.js "$1"; }
          # 当前正在用的键盘一定是已启用的
          cur=$(osascript -l JavaScript -e 'ObjC.import("Carbon"); ObjC.unwrap(ObjC.castRefToObject($.TISGetInputSourceProperty($.TISCopyCurrentKeyboardInputSource(), $("TISPropertyInputSourceID"))))')
          echo "current=$cur state=$(q "$cur") ABC=$(q com.apple.keylayout.ABC) US=$(q com.apple.keylayout.US)"
          [ "$(q "$cur")" = enabled ]
          [ "$(q no.such.input.source)" = absent ]
          [ "$(q io.senk.inputmethod.SenkWubi.Wubi)" = absent ]
      - name: Preview changes nothing
        run: |
          snapshot() {
            for d in "$HOME/Library/Rime" "$HOME/Library/Application Support/senk-input" "$HOME/Library/Logs/senk-input"; do
              [ -e "$d" ] && find "$d" -exec stat -f '%N %m %z' {} + || echo "absent $d"
            done
          }
          snapshot > "$RUNNER_TEMP/before"
          sh scripts/install-macos.sh
          sh scripts/install-macos.sh pinyin
          sh scripts/uninstall-macos.sh
          snapshot > "$RUNNER_TEMP/after"
          diff "$RUNNER_TEMP/before" "$RUNNER_TEMP/after"
      - name: Pinned SENK matches sha256 and signature
        run: |
          version=$(sed -n 's/^senk_version="\(.*\)"$/\1/p' scripts/install-macos.sh)
          sha=$(sed -n 's/^senk_sha256="\(.*\)"$/\1/p' scripts/install-macos.sh)
          zip="$RUNNER_TEMP/SenkWubi-$version.zip"
          curl -fsSL -o "$zip" "https://github.com/senk-io/senk-input-macos/releases/download/v$version/SenkWubi-$version.zip"
          echo "$sha  $zip" | shasum -a 256 -c -
          ditto -x -k "$zip" "$RUNNER_TEMP/x"
          app="$RUNNER_TEMP/x/SenkWubi.app"
          codesign --verify --deep --strict "$app"
          [ "$(codesign -dv "$app" 2>&1 | sed -n 's/^Identifier=//p')" = io.senk.inputmethod.SenkWubi ]
          # 安装脚本从这一项判断已装的版本
          [ "$(plutil -extract CFBundleVersion raw -o - "$app/Contents/Info.plist")" = "$version" ]
          lipo -archs "$app/Contents/MacOS/SenkWubi" | grep -q arm64
          lipo -archs "$app/Contents/MacOS/SenkWubi" | grep -q x86_64
