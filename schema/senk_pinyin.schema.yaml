# Rime schema
# encoding: utf-8
#
# 拼音（纯拼音，不含五笔）
# - 全拼、简拼、整句连打；装上可选语言模型后整句更准（scripts/install-grammar-macos.sh）
# - 开启用户词典，常用字词自动前移

schema:
  schema_id: senk_pinyin
  name: 拼音
  version: "0.5.0"
  author:
    - wubi86-pinyin contributors
  description: |
    简体拼音，整句连打。
    词库来自 rime-pinyin-simp（Apache-2.0），详见 data/NOTICE.md。
  dependencies:
    - pinyin_simp

switches:
  - name: ascii_mode
    reset: 0
    states: [ 中, 英 ]
  - name: full_shape
    states: [ 半角, 全角 ]
  - name: ascii_punct
    states: [ 。，, ．， ]

engine:
  processors:
    - ascii_composer
    - recognizer
    - key_binder
    - speller
    - punctuator
    - selector
    - navigator
    - express_editor
  segmentors:
    - ascii_segmentor
    - matcher
    - abc_segmentor
    - punct_segmentor
    - fallback_segmentor
  translators:
    - punct_translator
    - script_translator
  filters:
    - uniquifier

# 拼写规则与 rime-pinyin-simp 一致：简拼、常见误拼（如 lve/lue、ign/ing）
speller:
  alphabet: zyxwvutsrqponmlkjihgfedcba
  delimiter: " '"
  algebra:
    __include: pinyin_simp.schema:/speller/algebra

translator:
  dictionary: pinyin_simp
  prism: senk_pinyin
  enable_user_dict: true
  user_dict: senk_pinyin_user
  preedit_format:
    - xform/([nl])v/$1ü/
    - xform/([nl])ue/$1üe/
    - xform/([jqxy])v/$1u/

punctuator:
  import_preset: default

key_binder:
  import_preset: default

recognizer:
  import_preset: default
